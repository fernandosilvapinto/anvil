name: anvil

services:
  anvil-db:
    image: postgres:16-alpine
    container_name: anvil-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - anvil-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anvil

  anvil:
    image: quay.io/keycloak/keycloak:26.7
    container_name: anvil
    restart: unless-stopped
    command: ["start-dev", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://anvil-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: http://anvil.localtest.me:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "8081:8081"
      - "9000:9000"
    volumes:
      - ./themes:/opt/keycloak/themes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      anvil-db:
        condition: service_healthy
    networks:
      - anvil

  openldap:
    image: osixia/openldap:1.5.0
    container_name: anvil-ldap
    profiles:
      - federation
    environment:
      LDAP_ORGANISATION: Anvil Lab
      LDAP_DOMAIN: anvil.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    ports:
      - "1389:389"
    networks:
      - anvil

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: anvil-ldapadmin
    profiles:
      - federation
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8083:80"
    depends_on:
      - openldap
    networks:
      - anvil

  openfga:
    image: openfga/openfga:v1.12.0
    container_name: anvil-openfga
    profiles:
      - authz
    command: run
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "8084:8080"
      - "3001:3000"
    networks:
      - anvil

volumes:
  anvil-db-data:
  ldap-data:
  ldap-config:

networks:
  anvil:
    name: anvil-net
